<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="./../favicon.ico" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JukeBox Song Player</title>
    <meta
      name="description"
      content="https://jukeebox.github.io/icon_shadow_192.png"
    />
    <meta
      name="keywords"
      content="chiptune, instrumental, music, melody, composition, tool, square wave, NES, NSF, BeepBox"
    />
    <meta name="theme-color" content="#ad7760" />
    <meta property="og:image" content="../icon_maskable_192.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      property="og:image"
      content="https://jukeebox.github.io/icon_shadow_192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./../apple-touch-icon.png"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./../icon_32.png" />
    <!-- Self-hosted Google Fonts (Roboto) — no CDN dependency -->
    <link rel="stylesheet" href="./../assets/fonts/google/fonts.css" />
    <link rel="stylesheet" href="./../ancillary.css" />
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body class="page-player">
    <main>
      <script type="text/javascript">
        function browserHasRequiredFeatures() {
          "use strict";
          if (
            window.AudioContext == undefined &&
            window.webkitAudioContext == undefined
          ) {
            return false;
          }

          try {
            eval("class T {}");
            eval("const a = () => 0");
            eval("for (const a of []);");
          } catch (error) {
            return false;
          }

          return true;
        }

        if (browserHasRequiredFeatures()) {
          // Go ahead and load js beepbox editor interface:
          var fileref = document.createElement("script");
          fileref.setAttribute("type", "text/javascript");
          const date = new Date();
          if (date.getDate() == 1 && date.getMonth() == 3) {
            fileref.setAttribute("src", "foolish_player.min.js");
          } else {
            fileref.setAttribute("src", "beepbox_player.min.js");
          }
          document.head.appendChild(fileref);
        } else {
          document.body.textContent =
            "Sorry, BeepBox doesn't support your browser. Try a recent version of Chrome, Firefox, Edge, Safari, or Opera.";
        }
      </script>
    </main>
  </body>
</html>
