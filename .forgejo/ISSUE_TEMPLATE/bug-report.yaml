name: Bug Report
about: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's broken? Be specific.
      placeholder: "e.g. Mute button does not update until mouse hover"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to trigger the bug.
      placeholder: |
        1. Open editor
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead.
      placeholder: "The editor should ..."
    validations:
      required: false

  - type: dropdown
    id: context
    attributes:
      label: Affected context
      description: Which part of the app?
      multiple: true
      options:
        - editor
        - player
        - website
        - synth
        - shared
    validations:
      required: true

  - type: input
    id: project
    attributes:
      label: Project / MIDI (if applicable)
      description: Link or name of the song/project the bug appears in.
      placeholder: "e.g. example song URL"
    validations:
      required: false
